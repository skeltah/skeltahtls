name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - name: Unit tests (offline)
        run: pytest -m "not network"
      - name: Library loads on this platform
        run: python -c "import skeltahtls, skeltahtls._cffi as c; c._load(); print(skeltahtls.library_version(), skeltahtls.library_features())"
      - name: Fingerprint tests (network, best effort)
        continue-on-error: true
        run: pytest -m network

  containers:
    # the bundled Linux libraries on the platforms the runners above do not cover
    name: smoke ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glibc i386
            image: i386/python:3.12-slim
            platform: linux/386
            # Docker's default seccomp profile answers socketcall(2) - how 32-bit Go opens
            # sockets - with ENOSYS; outside Docker it just works
            opts: --security-opt seccomp=unconfined
          - name: glibc arm64
            image: python:3.12-slim
            platform: linux/arm64
          - name: glibc armv7
            image: python:3.12-slim
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platform, 'arm')
      - name: Load the library and send a request
        run: |
          set +e
          out=$(docker run --rm --platform ${{ matrix.platform }} ${{ matrix.opts }} -v "$PWD:/src" -w /src \
            ${{ matrix.image }} python -u -X faulthandler scripts/smoke_test.py 2>&1)
          code=$?
          echo "$out"
          # the tail as an annotation: readable on the run page without opening the log
          if [ $code -ne 0 ]; then
            echo "::error title=smoke ${{ matrix.name }}::$(echo "$out" | tail -n 12 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $code

  wheels:
    # every per-platform wheel holds exactly its own library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python scripts/build_wheels.py
