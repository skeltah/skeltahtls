# Rebuild the tls-client shared libraries from a bogdanfinn/tls-client ref.
# Linux + Windows are cross compiled with zig on ubuntu; macOS is built natively.
# Every Linux library is then loaded in a container of its own platform (i386, and arm64 /
# armv7 through qemu) and sends one real request.
# Result: a branch "binaries/<ref>" with the new files + manifest - merge the files you
# want, run scripts/gen_profiles.py and check the Chrome defaults / test hashes.
#
# Start it from the Actions tab, or by pushing a tag:  git push origin build-binaries/master
name: Build binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "bogdanfinn/tls-client tag or branch (e.g. v1.18.1, master)"
        required: true
  push:
    tags: ["build-binaries/*"]

env:
  REF: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: windows-amd64 windows-386 linux-amd64 linux-386 linux-arm64 linux-armv7
            files: "*.dll *.so"
          - os: macos-latest
            targets: darwin-arm64 darwin-amd64
            files: "*.dylib"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: "0.16.0"
      - name: Build
        run: |
          ref="${REF#build-binaries/}"
          python3 scripts/build_binaries.py "$ref" ${{ matrix.targets }}
      - name: Every target was built
        run: |
          for t in ${{ matrix.targets }}; do
            ls skeltahtls/dependencies/tls-client-$t.* || { echo "missing $t"; exit 1; }
          done
      - name: Load the macOS libraries
        if: runner.os == 'macOS'
        run: |
          python3 scripts/smoke_test.py
          for f in skeltahtls/dependencies/*.dylib; do echo "$f"; otool -l "$f" | grep -A3 LC_BUILD_VERSION | grep minos; done
      - name: Collect what this runner built (not the checked-out libraries of the other OS)
        run: |
          mkdir out
          cd skeltahtls/dependencies
          cp ${{ matrix.files }} manifest.json ../../out/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: out/

  smoke:
    needs: build
    # runs when only the macOS leg failed or was never picked up (macOS runner capacity)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glibc x86_64
            image: python:3.12-slim
            platform: linux/amd64
          - name: glibc i386
            image: i386/python:3.12-slim
            platform: linux/386
            # Docker's default seccomp profile answers socketcall(2) - how 32-bit Go opens
            # sockets - with ENOSYS; outside Docker it just works
            opts: --security-opt seccomp=unconfined
          - name: glibc arm64
            image: python:3.12-slim
            platform: linux/arm64
          - name: glibc armv7
            image: python:3.12-slim
            platform: linux/arm/v7
    name: smoke ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries-ubuntu-latest
          path: skeltahtls/dependencies
      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platform, 'arm')
      - name: Load the library and send a request
        run: |
          set +e
          out=$(docker run --rm --platform ${{ matrix.platform }} ${{ matrix.opts }} -v "$PWD:/src" -w /src \
            ${{ matrix.image }} python -u -X faulthandler scripts/smoke_test.py 2>&1)
          code=$?
          echo "$out"
          # the tail as an annotation: readable on the run page without opening the log
          if [ $code -ne 0 ]; then
            echo "::error title=smoke ${{ matrix.name }}::$(echo "$out" | tail -n 12 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $code

  commit:
    needs: build
    # commits whatever was built; a missing OS keeps the libraries already in the repo
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge artifacts and manifests
        run: |
          python3 - <<'PY'
          import json, shutil, pathlib
          dep = pathlib.Path("skeltahtls/dependencies")
          manifest = json.loads((dep / "manifest.json").read_text())
          for art in pathlib.Path("artifacts").iterdir():
              part = json.loads((art / "manifest.json").read_text())
              built = {f.name for f in art.iterdir() if f.suffix in (".dll", ".so", ".dylib")}
              manifest["files"].update({k: v for k, v in part["files"].items() if k in built})
              manifest.update({k: part[k] for k in ("version", "source", "updated")})
              for name in built:
                  shutil.copyfile(art / name, dep / name)
          (dep / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Push branch
        run: |
          ref="${REF#build-binaries/}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "binaries/$ref"
          git add skeltahtls/dependencies
          git commit -m "Rebuild tls-client binaries from $ref"
          git push -f -u origin "binaries/$ref"
